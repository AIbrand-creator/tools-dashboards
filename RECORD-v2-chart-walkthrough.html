<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#070709">
<title>So you have your chart. Now what? Human Design ReDefined</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Display:ital,wght@0,400;0,500;1,400;1,500&family=Syne:wght@600;700&family=Saira+Extra+Condensed:wght@600;700&family=Space+Mono:wght@400;700&family=Archivo:wght@400;500&family=Noto+Sans+Symbols&family=Noto+Sans+Math&display=swap" rel="stylesheet">
<style>
/* Chart Walkthrough - brand tokens copied from
   /home/terezka/Stažené/What-Do-you-want-to-use-HD-for.html
   Fonts corrected per Tereza 2026-09-29: Noto Serif Display / Syne /
   Saira Extra Condensed / Space Mono / Archivo. No Gloock, no DM Sans,
   no Caveat, no teal, no blue overlays.
   Split-stage layout 2026-09-29 (v2): text panel left 45%, chart panel
   right 55%, so the two never physically overlap - no backdrop needed. */

:root {
  --void: #070709;
  --void-2: #0b0b0e;
  --bone: #f2ede8;
  --soft: #c8c0bb;
  --muted: #8d8581;
  --red: #f01445;
  --mid: #d4499f;
  --violet: #8c66ff;
  --line: rgba(255, 255, 255, .12);
  --glow-rgb: 240, 20, 69;
  --wash-a: rgba(240, 20, 69, .16);
  --wash-b: rgba(140, 102, 255, .12);
  --ease: cubic-bezier(.22, 1, .36, 1);
  --ink: #0b0a0d;
}

* { box-sizing: border-box; }
html { color-scheme: dark; }

body {
  margin: 0;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  color: var(--bone);
  background: var(--void);
  font-family: "Archivo", system-ui, sans-serif;
}

.stage-wrap {
  position: relative;
  width: 100vw;
  height: 100vh;
  aspect-ratio: 16 / 9;
  margin: 0 auto;
  overflow: hidden;
  display: flex;
  background:
    radial-gradient(60rem 46rem at 10% 6%, var(--wash-a), transparent 62%),
    radial-gradient(50rem 38rem at 94% 92%, var(--wash-b), transparent 66%),
    linear-gradient(180deg, var(--void) 0%, var(--void-2) 100%);
}
@supports (aspect-ratio: 16/9) {
  .stage-wrap { max-height: 100vh; max-width: 177.78vh; }
}

/* ---------- LEFT: text panel ---------- */
.text-panel {
  position: relative;
  width: 45%;
  height: 100%;
  flex: 0 0 45%;
  padding: 52px 40px 52px 56px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 20px;
}

.wordmark {
  position: absolute;
  top: 40px;
  left: 56px;
  font-family: "Space Mono", monospace;
  font-weight: 700;
  font-size: 14px;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--bone);
  opacity: .8;
}
.wordmark .re { color: var(--red); }

.step-mini {
  font-family: "Space Mono", monospace;
  font-weight: 700;
  font-size: 15px;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--red);
  opacity: .9;
}

.headline {
  font-family: "Noto Serif Display", "Noto Sans Symbols", "Noto Sans Math", serif;
  font-style: italic;
  font-weight: 500;
  font-size: clamp(64px, 6vw, 100px);
  line-height: 1.02;
  margin: 0;
  letter-spacing: -.015em;
  max-width: 100%;
}
.headline .grad {
  background: linear-gradient(100deg, var(--red) 0%, var(--mid) 50%, var(--violet) 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  filter: drop-shadow(0 0 26px rgba(var(--glow-rgb), .22));
  font-style: italic;
}

.bullets {
  list-style: none;
  margin: 6px 0 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 12px;
  max-width: 92%;
}
.bullets li {
  font-family: "Archivo", sans-serif;
  font-weight: 400;
  font-size: clamp(20px, 1.7vw, 30px);
  line-height: 1.32;
  color: var(--bone);
  opacity: .82;
  padding-left: 26px;
  position: relative;
}
.bullets li::before {
  content: "";
  position: absolute;
  left: 0;
  top: .55em;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: linear-gradient(100deg, var(--red), var(--violet));
}

.side-callout {
  margin-top: 10px;
  display: inline-flex;
  align-items: center;
  gap: 14px;
  padding: 16px 22px;
  border-radius: 14px;
  background: rgba(255, 255, 255, .04);
  border: 1px solid rgba(242, 237, 232, .14);
  width: fit-content;
}
.side-callout .glyph { font-family: "Noto Sans Symbols", "Noto Sans Math", sans-serif; font-size: 32px; background: linear-gradient(100deg,var(--red),var(--violet)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.side-callout .num { font-family: "Saira Extra Condensed", sans-serif; font-weight: 700; font-size: 32px; color: var(--bone); }
.side-callout .lbl { font-family: "Syne", sans-serif; font-weight: 600; font-size: 16px; color: var(--soft); letter-spacing: .02em; }

.side-big-num {
  font-family: "Saira Extra Condensed", sans-serif;
  font-weight: 700;
  font-size: 150px;
  line-height: 1;
  background: linear-gradient(100deg, var(--red) 0%, var(--mid) 50%, var(--violet) 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  filter: drop-shadow(0 0 30px rgba(var(--glow-rgb), .22));
  margin-top: 6px;
}

/* ---------- RIGHT: chart panel ---------- */
.chart-panel {
  position: relative;
  width: 55%;
  height: 100%;
  flex: 0 0 55%;
}
#stage {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  background: transparent;
}

/* ---------- camera / dim / focus ---------- */
#camera { transition: none; }
.cam-anim #camera { transition: transform 900ms var(--ease); }
@media (prefers-reduced-motion: reduce) {
  .cam-anim #camera { transition: none; }
}

.dimmable { opacity: 1; transition: opacity 500ms var(--ease); }
.dimmable.dim { opacity: .22; }
.dimmable.focus { opacity: 1; }

@keyframes pulseGlow {
  0%, 100% { filter: drop-shadow(0 0 8px rgba(var(--glow-rgb), .55)); }
  50% { filter: drop-shadow(0 0 22px rgba(var(--glow-rgb), .9)); }
}
.pulse { animation: pulseGlow 1.6s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) {
  .pulse { animation: none; filter: drop-shadow(0 0 14px rgba(var(--glow-rgb), .6)); }
}

body.ui-hidden .text-panel,
body.ui-hidden .controls,
body.ui-hidden .step-label { opacity: 0 !important; pointer-events: none; }

body.captions-off .text-panel { opacity: 0; pointer-events: none; }

body.idle .controls, body.idle .step-label { opacity: 0; }
.controls, .step-label { transition: opacity 600ms var(--ease); }

/* ---------- controls (bottom-right of the chart panel) ---------- */
.controls {
  position: absolute;
  right: 5%;
  bottom: 5%;
  display: flex;
  align-items: center;
  gap: 14px;
  z-index: 10;
}
.nav-btn {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  border: 1px solid var(--line);
  background: linear-gradient(110deg, rgba(var(--glow-rgb), .22), rgba(140, 102, 255, .14));
  color: var(--bone);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 10px 30px rgba(0, 0, 0, .5);
  transition: transform 220ms var(--ease), box-shadow 220ms var(--ease);
}
.nav-btn:hover { transform: translateY(-2px); box-shadow: 0 0 26px rgba(var(--glow-rgb), .35); }
.nav-btn svg { width: 22px; height: 22px; }
.nav-btn:disabled { opacity: .3; cursor: default; transform: none; box-shadow: none; }

.step-label {
  position: absolute;
  left: 5%;
  bottom: 5%;
  font-family: "Space Mono", monospace;
  font-size: 12px;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--muted);
  z-index: 10;
}
.step-label .n { color: var(--bone); font-family: "Saira Extra Condensed", sans-serif; font-weight: 700; font-size: 15px; }

/* ---------- step list modal ---------- */
.step-modal {
  position: absolute;
  inset: 0;
  background: rgba(6, 6, 8, .86);
  backdrop-filter: blur(6px);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 20;
}
.step-modal.open { display: flex; }
.step-panel {
  width: min(78%, 1100px);
  max-height: 78%;
  overflow-y: auto;
  background: linear-gradient(180deg, rgba(16, 15, 19, .96), rgba(9, 9, 11, .98));
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 28px 12px 28px 28px;
  box-shadow: 0 40px 120px rgba(0, 0, 0, .7);
}
.step-panel h2 {
  font-family: "Syne", sans-serif;
  font-size: 18px;
  letter-spacing: .08em;
  text-transform: uppercase;
  margin: 0 0 16px;
  color: var(--soft);
  padding-right: 16px;
}
.step-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px 22px; padding-right: 16px; }
.step-item {
  display: flex;
  gap: 10px;
  align-items: baseline;
  padding: 7px 10px;
  border-radius: 8px;
  cursor: pointer;
  font-family: "Archivo", sans-serif;
  font-size: 13.5px;
  color: var(--soft);
}
.step-item:hover { background: rgba(240, 20, 69, .1); color: var(--bone); }
.step-item.current { background: rgba(140, 102, 255, .14); color: var(--bone); }
.step-item .idx { font-family: "Saira Extra Condensed", sans-serif; font-weight: 700; color: var(--red); min-width: 22px; }

/* ---------- SVG-scoped brand rules (override embedded bodygraph teal),
   sizes scaled up ~2x for gate numbers, ~2.5x for active channel lines,
   per the v2 "readable at 1080p" pass. ---------- */
#bodygraph .center.defined { fill: url(#grad-defined); stroke: url(#grad-defined); filter: url(#glow-brand); }
#bodygraph .center.undefined-fill { fill: rgba(242, 237, 232, .85); stroke: rgba(242, 237, 232, .5); }
#bodygraph .channel-track { stroke-width: 6 !important; }
#bodygraph .channel-track.defined-personality { stroke: var(--bone); stroke-width: 11 !important; filter: url(#glow-brand-soft); }
#bodygraph .channel-track.defined-design { stroke: var(--red); stroke-width: 11 !important; filter: url(#glow-brand-soft); }
#bodygraph .channel-track.defined-both { stroke: url(#stripe-both); stroke-width: 12 !important; filter: url(#glow-brand-soft); }
#bodygraph .gate-segment { stroke-width: 11 !important; }
#bodygraph .gate-segment.personality.on { stroke: var(--bone); }
#bodygraph .gate-segment.design.on { stroke: var(--red); }
#bodygraph .gate-segment.both.on { stroke: url(#stripe-both); }
#bodygraph .gate-label.active.personality { fill: var(--bone); }
#bodygraph .gate-label.active.design { fill: var(--red); }
#bodygraph .gate-label.active.both { fill: var(--violet); }
/* contrast override: a gate number sitting inside a FILLED center (defined
   gradient or undefined ivory wash) always needs dark ink, regardless of
   its personality/design colour-coding - must win over .active.* above. */
#bodygraph .gate-label.on-defined { fill: var(--ink) !important; }
#bodygraph .gate-label { font-family: "Saira Extra Condensed", "Space Mono", monospace; font-size: 30px; }
#bodygraph .gate-dot { pointer-events: none; }

#bodygraph.bg-glow {
  filter:
    drop-shadow(0 0 9px rgba(240, 20, 69, .65))
    drop-shadow(0 0 20px rgba(212, 73, 159, .55))
    drop-shadow(0 0 34px rgba(140, 102, 255, .45));
}

.row { transition: opacity 500ms var(--ease); opacity: 1; }
.row.row-dim { opacity: .22; }
.row.row-focus { opacity: 1; }
.row.row-focus .row-num { filter: drop-shadow(0 0 10px rgba(var(--glow-rgb), .7)); }

.profile-line { transition: fill 300ms var(--ease); }
.profile-line.spotlight {
  fill: url(#grad-defined);
  filter: drop-shadow(0 0 8px rgba(140, 102, 255, .8));
}

.planet-col { font-family: "Saira Extra Condensed", sans-serif; }
.planet-col .col-header {
  font-family: "Syne", sans-serif;
  font-weight: 700;
  letter-spacing: .1em;
  text-transform: uppercase;
}
.planet-col .row-glyph { font-family: "Noto Sans Symbols", "Noto Sans Math", sans-serif; }
.planet-col .row-num { font-family: "Saira Extra Condensed", sans-serif; font-weight: 600; }

.mandala-label {
  font-family: "Syne", sans-serif;
  font-weight: 700;
  letter-spacing: .1em;
  text-transform: uppercase;
  paint-order: stroke;
  stroke: rgba(7, 7, 9, .9);
  stroke-width: 5px;
  stroke-linejoin: round;
}
.mandala-gate-num {
  font-family: "Saira Extra Condensed", sans-serif;
  font-weight: 600;
  paint-order: stroke;
  stroke: rgba(7, 7, 9, .85);
  stroke-width: 3px;
  stroke-linejoin: round;
}

/* ---------- variables: small flag/pill arrows, deliberately unlike the
   round nav buttons so they never read as UI chrome ---------- */
.var-arrow .var-pill {
  fill: rgba(11, 10, 13, .55);
  stroke: rgba(242, 237, 232, .18);
  stroke-width: 1;
}
.var-arrow.var-digestion .var-pill, .var-arrow.var-environment .var-pill { stroke: rgba(240, 20, 69, .3); }
.var-arrow.var-motivation .var-pill, .var-arrow.var-perspective .var-pill { stroke: rgba(242, 237, 232, .3); }
.var-arrow .var-head { stroke-linecap: round; stroke-linejoin: round; fill: none; }
.var-label { font-family: "Syne", sans-serif; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }

</style>

/* ---------------------------------------------------------------------
   Derive activation state purely from the chart JSON + the real gate
   partner-pairs already present in the embedded bodygraph SVG
   (data-gate / data-channel on .gate-segment elements). No hardcoded
   HD gate-to-gate table - read straight from the geometry that is on
   the page.
--------------------------------------------------------------------- */
function deriveState(bodygraphRoot) {
  const perSet = new Set(CHART.planets.personality.map(p => p.gate));
  const desSet = new Set(CHART.planets.design.map(p => p.gate));
  const activeGates = new Map(); // gate -> 'personality'|'design'|'both'
  perSet.forEach(g => activeGates.set(g, desSet.has(g) ? 'both' : 'personality'));
  desSet.forEach(g => { if (!activeGates.has(g)) activeGates.set(g, 'design'); });

  // partner map from the real SVG: gate -> partner gate (other end of its channel track)
  const partner = new Map();
  bodygraphRoot.querySelectorAll('.gate-segment').forEach(seg => {
    const g = Number(seg.getAttribute('data-gate'));
    const ch = seg.getAttribute('data-channel'); // "a-b"
    const [a, b] = ch.split('-').map(Number);
    partner.set(g, g === a ? b : a);
  });

  const definedChannelGateSet = new Set();
  CHART.channels.forEach(c => c.gates.forEach(g => definedChannelGateSet.add(g)));

  // hanging = activated gate whose partner is NOT activated (not part of a
  // fully defined channel)
  const hanging = new Set();
  activeGates.forEach((_, g) => {
    if (!definedChannelGateSet.has(g)) hanging.add(g);
  });

  return { activeGates, partner, definedChannelGateSet, hanging };
}

/* Point-in-shape containment, derived from the real center geometry
   already on the page (polygon points / rect x,y,w,h) - used only to
   decide whether a gate number needs dark ink for contrast against a
   filled center. */
function pointInPolygon(x, y, pts) {
  let inside = false;
  for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
    const xi = pts[i][0], yi = pts[i][1], xj = pts[j][0], yj = pts[j][1];
    const intersect = ((yi > y) !== (yj > y)) &&
      (x < (xj - xi) * (y - yi) / (yj - yi) + xi);
    if (intersect) inside = !inside;
  }
  return inside;
}
function centerShapes(bodygraphRoot) {
  const shapes = [];
  bodygraphRoot.querySelectorAll('#centers .center').forEach(c => {
    if (c.tagName === 'polygon') {
      const pts = c.getAttribute('points').trim().split(/\s+/).map(p => p.split(',').map(Number));
      shapes.push({ id: c.id, kind: 'poly', pts });
    } else {
      const x = Number(c.getAttribute('x')), y = Number(c.getAttribute('y'));
      const w = Number(c.getAttribute('width')), h = Number(c.getAttribute('height'));
      shapes.push({ id: c.id, kind: 'rect', x, y, w, h });
    }
  });
  return shapes;
}
function shapeContains(shape, x, y) {
  if (shape.kind === 'poly') return pointInPolygon(x, y, shape.pts);
  return x >= shape.x && x <= shape.x + shape.w && y >= shape.y && y <= shape.y + shape.h;
}

/* ---------------------------------------------------------------------
   Build
--------------------------------------------------------------------- */
function init() {
  const bodygraph = document.getElementById('bodygraph');
  const state = deriveState(bodygraph);
  const shapes = centerShapes(bodygraph);
  const definedCenterIds = new Set(
    CHART.centers.defined.map(code => CENTER_CODE_TO_ID[code])
  );

  // 1. Centers: defined -> gradient fill; all others -> filled ivory
  //    ("Some are coloured. Some are white.") - both readable, neither left
  //    as plain transparent-on-dark.
  bodygraph.querySelectorAll('#centers .center').forEach(c => {
    if (definedCenterIds.has(c.id)) {
      c.classList.add('defined');
    } else {
      c.classList.add('undefined-fill');
    }
  });

  // 2. Gate labels + gate-segments: active/inactive, personality/design/both
  bodygraph.querySelectorAll('.gate-label').forEach(t => {
    const g = Number(t.getAttribute('data-gate'));
    const s = state.activeGates.get(g);
    if (s) {
      t.classList.add('active', s);
      const gx = Number(t.getAttribute('x')), gy = Number(t.getAttribute('y'));
      for (const shape of shapes) {
        if (shapeContains(shape, gx, gy)) { t.classList.add('on-defined'); break; }
      }
    }
  });
  bodygraph.querySelectorAll('.gate-segment').forEach(seg => {
    const g = Number(seg.getAttribute('data-gate'));
    const s = state.activeGates.get(g);
    if (s && !state.hanging.has(g)) {
      // both ends of this gate's channel are active -> full channel, colour by
      // combined state of the two gate ends
      const ch = seg.getAttribute('data-channel');
      const [a, b] = ch.split('-').map(Number);
      const sa = state.activeGates.get(a), sb = state.activeGates.get(b);
      const combined = (sa === sb) ? sa : 'both';
      seg.classList.add(combined, 'on');
    } else if (s && state.hanging.has(g)) {
      seg.classList.add(s, 'on');
    }
  });
  // colour the shared channel-track for any fully defined channel
  CHART.channels.forEach(c => {
    const [a, b] = c.gates;
    const sa = state.activeGates.get(a), sb = state.activeGates.get(b);
    const combined = (sa === sb) ? sa : 'both';
    const track = bodygraph.querySelector(`.channel-track[data-channel="${a}-${b}"], .channel-track[data-channel="${b}-${a}"]`);
    if (track) track.classList.add(`defined-${combined}`);
  });

  // small activation discs next to each active gate number
  const gateDotsGroup = el('g', { id: 'gate-dots' });
  bodygraph.querySelectorAll('.gate-label.active').forEach(t => {
    const g = Number(t.getAttribute('data-gate'));
    const s = state.activeGates.get(g);
    const x = Number(t.getAttribute('x')), y = Number(t.getAttribute('y'));
    const dx = x + 13, dy = y - 10;
    let fill = s === 'personality' ? 'var(--bone)' : s === 'design' ? 'var(--red)' : 'url(#grad-defined)';
    gateDotsGroup.appendChild(el('circle', { class: 'gate-dot', cx: dx, cy: dy, r: 4.5, fill }));
  });
  bodygraph.querySelector('#gate-labels').parentNode.appendChild(gateDotsGroup);

  renderPlanetColumns(state);
  renderVariables();
  const wheelInfo = renderMandala();
  renderCross(wheelInfo);

  return { state, shapes, wheelInfo };
}

/* ---------------------------------------------------------------------
   Variables - four small flag/pill arrows above the head, direction from
   the JSON `arrow` field. Deliberately NOT a bare chevron: a bare "<"/">"
   glyph at this size reads as a nav-button icon, so each variable gets a
   rounded pill body with a short shaft + arrowhead inside it, sitting in
   a 2x2 grid (columns = Design/Personality, rows = top/bottom pair).
--------------------------------------------------------------------- */
function pillArrowHead(direction, w) {
  // shaft + arrowhead, in the SAME local space as the pill rect (x: 0..w,
  // y centred on 0) - no post-hoc coordinate shifting.
  const pad = 14;
  const x0 = pad, x1 = w - pad;
  return direction === 'left'
    ? `M ${x1} 0 L ${x0} 0 M ${x0 + 9} -6 L ${x0} 0 L ${x0 + 9} 6`
    : `M ${x0} 0 L ${x1} 0 M ${x1 - 9} -6 L ${x1} 0 L ${x1 - 9} 6`;
}
function renderVariables() {
  const g = document.getElementById('variables-group');
  const v = CHART.variables;
  // Compact: the whole 2x2 grid must fit above the bodygraph, centred on
  // the chart panel's own centre (PANEL_W/2), between the top margin and
  // BODY_Y.
  const PW = 82, PH = 17, GAP_X = 12, GAP_Y = 6;
  const cx = PANEL_W / 2;
  const colXs = [cx - GAP_X / 2 - PW, cx + GAP_X / 2];
  const rowYs = [40, 40 + PH + GAP_Y];
  const specs = [
    { key: 'digestion', col: 0, row: 0, side: 'design' },
    { key: 'environment', col: 0, row: 1, side: 'design' },
    { key: 'motivation', col: 1, row: 0, side: 'personality' },
    { key: 'perspective', col: 1, row: 1, side: 'personality' }
  ];
  specs.forEach(s => {
    const data = v[s.key];
    const posX = colXs[s.col], posY = rowYs[s.row];
    const colour = s.side === 'design' ? 'var(--red)' : 'var(--bone)';
    const arrow = el('g', { class: `dimmable var-arrow var-${s.key}`, id: `var-${s.key}`, transform: `translate(${posX},${posY})` });
    arrow.appendChild(el('rect', { class: 'var-pill', x: 0, y: -PH / 2, width: PW, height: PH, rx: PH / 2 }));
    arrow.appendChild(el('path', {
      class: 'var-head', d: pillArrowHead(data.arrow, PW),
      stroke: colour, 'stroke-width': 2.6
    }));
    // Anchor design labels toward the outer (left) edge and personality
    // labels toward the outer (right) edge, so the two columns' labels
    // spread apart instead of both centring into the narrow gap between
    // the pills and colliding (v2: pills sit close together at panel centre).
    const labelY = s.row === 0 ? -PH / 2 - 8 : PH / 2 + 18;
    const labelAnchor = s.side === 'design' ? 'end' : 'start';
    const labelX = s.side === 'design' ? PW : 0;
    arrow.appendChild(text({
      x: labelX, y: labelY, class: 'var-label var-label-text', 'text-anchor': labelAnchor,
      'font-size': 12, fill: colour, opacity: 0
    }, s.key.toUpperCase()));
    g.appendChild(arrow);
  });
}

/* ---------------------------------------------------------------------
   Mandala wheel - 64 gates in MANDALA_SEQUENCE order, four quarter arcs,
   her four cross gates marked. Hidden by default.
--------------------------------------------------------------------- */
const WHEEL_CX = PANEL_W / 2, WHEEL_CY = BODY_Y + BODY_H / 2; // aligned to the bodygraph's own vertical centre
const WHEEL_R_ARC = 320, WHEEL_R_TICK_IN = 335, WHEEL_R_TICK_OUT = 352, WHEEL_R_NUM = 378, WHEEL_R_LABEL = 408;

function renderMandala() {
  const g = document.getElementById('mandala-group');
  const cx = WHEEL_CX, cy = WHEEL_CY;
  const rNum = WHEEL_R_NUM, rTickOut = WHEEL_R_TICK_OUT, rTickIn = WHEEL_R_TICK_IN, rArc = WHEEL_R_ARC;
  const n = 64;

  const QUARTER_COLORS = ['url(#grad-defined)', 'var(--bone)', 'url(#grad-defined)', 'var(--bone)'];

  // arcs
  const quarterArcsGroup = el('g', { id: 'mandala-arcs' });
  QUARTERS.forEach((q, qi) => {
    const idxs = q.gates.map(gg => MANDALA_SEQUENCE.indexOf(gg)).sort((a, b) => a - b);
    // contiguous circular arc: find start (after the single big gap)
    let startIdx = idxs[0];
    for (let i = 0; i < idxs.length; i++) {
      const cur = idxs[i], nextI = idxs[(i + 1) % idxs.length];
      const d = ((nextI - cur) + n) % n;
      if (d !== 1) { startIdx = nextI; break; }
    }
    const a0 = (startIdx / n) * 360 - 90;
    const a1 = a0 + (16 / n) * 360;
    const path = arcPath(cx, cy, rArc, a0, a1);
    const p = el('path', {
      d: path, fill: 'none', stroke: QUARTER_COLORS[qi], 'stroke-width': 14,
      opacity: 0.85, class: `dimmable quarter-arc quarter-${q.id}`, id: `arc-${q.id}`
    });
    quarterArcsGroup.appendChild(p);
    const midA = (a0 + a1) / 2;
    const lx = cx + WHEEL_R_LABEL * Math.cos(midA * Math.PI / 180);
    const ly = cy + WHEEL_R_LABEL * Math.sin(midA * Math.PI / 180);
    const lbl = text({
      x: lx, y: ly, class: `mandala-label dimmable quarter-label quarter-label-${q.id}`,
      'text-anchor': 'middle', 'font-size': 16, fill: 'var(--soft)'
    }, q.name);
    quarterArcsGroup.appendChild(lbl);
  });
  g.appendChild(quarterArcsGroup);

  // ticks + numbers
  const gatesGroup = el('g', { id: 'mandala-gates' });
  const gatePos = {};
  MANDALA_SEQUENCE.forEach((gate, i) => {
    const a = (i / n) * 360 - 90;
    const rad = a * Math.PI / 180;
    const x1 = cx + rTickIn * Math.cos(rad), y1 = cy + rTickIn * Math.sin(rad);
    const x2 = cx + rTickOut * Math.cos(rad), y2 = cy + rTickOut * Math.sin(rad);
    const xn = cx + rNum * Math.cos(rad), yn = cy + rNum * Math.sin(rad);
    gatePos[gate] = { x: xn, y: yn, angle: a };
    gatesGroup.appendChild(el('line', { x1, y1, x2, y2, stroke: 'rgba(242,237,232,.35)', 'stroke-width': 2, class: 'dimmable mandala-tick', id: `wheel-tick-${gate}` }));
    gatesGroup.appendChild(text({
      x: xn, y: yn, class: `mandala-gate-num dimmable wheel-gate wheel-gate-${gate}`,
      'text-anchor': 'middle', 'dominant-baseline': 'middle', 'font-size': 14, fill: 'var(--soft)'
    }, String(gate)));
  });
  g.appendChild(gatesGroup);

  return { cx, cy, gatePos };
}
function arcPath(cx, cy, r, a0, a1) {
  const r0 = a0 * Math.PI / 180, r1 = a1 * Math.PI / 180;
  const x0 = cx + r * Math.cos(r0), y0 = cy + r * Math.sin(r0);
  const x1 = cx + r * Math.cos(r1), y1 = cy + r * Math.sin(r1);
  const large = (a1 - a0) > 180 ? 1 : 0;
  return `M ${x0} ${y0} A ${r} ${r} 0 ${large} 1 ${x1} ${y1}`;
}

/* Cross connector: Sun and Earth are always exactly opposite each other on
   the wheel (180 degrees apart), so the cross is two straight lines through
   the wheel centre: Personality Sun to Personality Earth, and Design Sun to
   Design Earth (only shown for beat 16). */
function renderCross(wheelInfo) {
  const g = document.getElementById('cross-group');
  const ic = CHART.incarnation_cross;
  const gates = [ic.personality_sun, ic.personality_earth, ic.design_sun, ic.design_earth];
  const pts = gates.map(gt => wheelInfo.gatePos[gt]);

    g.appendChild(el('circle', { cx: p.x, cy: p.y, r: 11, fill: 'none', stroke: 'url(#grad-defined)', 'stroke-width': 3, class: `cross-ring cross-ring-${gate}` }));
  });
  const [pSun, pEarth, dSun, dEarth] = pts;
  g.insertBefore(el('line', { x1: pSun.x, y1: pSun.y, x2: pEarth.x, y2: pEarth.y, stroke: 'var(--bone)', 'stroke-width': 2, 'stroke-dasharray': '3 6', opacity: 0.85, id: 'cross-line-personality' }), g.firstChild);

}

const PANEL_ASPECT = PANEL_W / PANEL_H;
function cam(cx, cy, w) {
  const h = w / PANEL_ASPECT;
  return { x: cx - w / 2, y: cy - h / 2, w, h };
}
/* Build a camera rect (matching the chart panel's own aspect ratio) that
   comfortably covers a set of real stage points (a wheel-gate position, a
   bodygraph gate label, a column row). Used instead of hand-guessed
   centers so beats that must land on one specific gate actually land on
   it. */
function camCover(points, minW, padX = 120, padY = 90) {
  const xs = points.map(p => p.x), ys = points.map(p => p.y);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
  let w = Math.max(minW, (x1 - x0) + padX * 2);
  let h = w / PANEL_ASPECT;
  const neededH = (y1 - y0) + padY * 2;
  if (neededH > h) { h = neededH; w = h * PANEL_ASPECT; }
  return cam(cx, cy, w);
}
/* The entire chart panel, unscaled. */
const FULL = cam(PANEL_W / 2, PANEL_H / 2, PANEL_W);

function quarterOf(gate) {

let beats, cur = 0, built;
const DIMMABLE_IDS = ['design-col', 'personality-col', 'variables-group', 'mandala-group'];

function clearBeatState() {
  DIMMABLE_IDS.forEach(id => document.getElementById(id).classList.remove('dim', 'focus'));
  document.querySelectorAll('.pulse').forEach(n => n.classList.remove('pulse'));
  document.getElementById('bodygraph').classList.remove('bg-glow');
  document.querySelectorAll('.row').forEach(r => r.classList.remove('row-focus', 'row-dim'));
  document.querySelectorAll('.quarter-arc, .quarter-label').forEach(n => { n.classList.remove('dim', 'focus'); n.style.opacity = 0.85; });
  document.querySelectorAll('.wheel-gate, .mandala-tick').forEach(n => n.classList.remove('dim', 'focus'));
  document.getElementById('cross-group').style.opacity = 0;
  document.querySelectorAll('.cross-ring').forEach(n => n.style.opacity = 1);
  document.querySelectorAll('.var-label-text').forEach(n => n.setAttribute('opacity', 0));
  document.querySelectorAll('.var-arrow').forEach(n => n.classList.remove('dim'));
  document.querySelectorAll('.profile-line').forEach(n => n.classList.remove('spotlight'));
  document.getElementById('side-callout').style.display = 'none';
  document.getElementById('side-big-num').style.display = 'none';
  const conn = document.getElementById('dyn-connector');
  if (conn) conn.remove();
  const trace = document.getElementById('channel-trace-fx');
  if (trace) trace.remove();
}

function applyBeat(i) {
  const b = beats[i];
  clearBeatState();

  // camera: transform the fixed 1920x1080 stage so rect c fills it
  const c = b.camera;
  const scale = PANEL_W / c.w;
  const tx = -c.x * scale, ty = -c.y * scale;
  document.getElementById('camera').setAttribute('transform', `translate(${tx},${ty}) scale(${scale})`);

  // mandala
  document.getElementById('mandala-group').style.opacity = b.mandala ? 1 : 0;
  document.getElementById('mandala-group').style.pointerEvents = b.mandala ? 'auto' : 'none';

  // generic dim set
  (b.dim || []).forEach(id => document.getElementById(id).classList.add('dim'));

  if (b.bgGlow) {
    document.getElementById('bodygraph').classList.add('bg-glow');
  }
  if (b.pulseSelector) {
    document.querySelectorAll(b.pulseSelector).forEach(n => n.classList.add('pulse'));
  }
  if (b.focusRows) {
    document.querySelectorAll('.row').forEach(r => {
      if (b.focusRows.includes(r.id)) r.classList.add('row-focus');
      else r.classList.add('row-dim');
    });
  }
  if (b.focusGates) {
    b.focusGates.forEach(g => {
      const t = document.getElementById(`gate-${g}`);
      if (t) t.classList.add('pulse');
    });
  }
  if (b.quarterFocus) {
    QUARTERS.forEach(q => {
      const arc = document.getElementById(`arc-${q.id}`);
      const lbl = document.querySelector(`.quarter-label-${q.id}`);
      const focused = b.quarterFocus === 'all' || b.quarterFocus === q.id;
      arc.style.opacity = focused ? 1 : 0.18;
      lbl.style.opacity = focused ? 1 : 0.18;
      if (focused && b.quarterFocus !== 'all') { arc.classList.add('pulse'); }
    });
  }
  if (b.focusWheelGates) {
    document.querySelectorAll('.wheel-gate').forEach(n => n.classList.add('dim'));
    document.querySelectorAll('.mandala-tick').forEach(n => n.classList.add('dim'));
    b.focusWheelGates.forEach(g => {
      const wg = document.querySelector(`.wheel-gate-${g}`);
      const wt = document.getElementById(`wheel-tick-${g}`);
      if (wg) { wg.classList.remove('dim'); wg.classList.add('focus', 'pulse'); }
      if (wt) { wt.classList.remove('dim'); wt.classList.add('focus'); }
    });
    // when the cross rings are also showing, make it obvious which of the
    // four this particular beat means: pulse the target ring(s), dim the
    // other three so they read as context rather than competing focal points
    if (b.crossOn) {
      document.querySelectorAll('.cross-ring').forEach(n => {
        const g = Number(n.className.baseVal.match(/cross-ring-(\d+)/)[1]);
        if (b.focusWheelGates.includes(g)) { n.style.opacity = 1; n.classList.add('pulse'); }
        else { n.style.opacity = 0.3; }
      });
    }
  }
  if (b.crossOn) {
    document.getElementById('cross-group').style.opacity = 1;
  }
  if (b.profileOn) {
    document.querySelectorAll('.profile-line').forEach(n => n.classList.add('spotlight'));
  }
  if (b.sideBigNum) {
    const big = document.getElementById('side-big-num');
    big.textContent = b.sideBigNum;
    big.style.display = 'block';
  }
  if (b.sideCallout) {
    const card = document.getElementById('side-callout');
    const info = b.sideCallout;
    card.innerHTML = `<span class="glyph">${info.glyph}</span><span class="num">${info.gate}.${info.line}</span><span class="lbl">${info.label}</span>`;
    card.style.display = 'inline-flex';
  }
  if (b.channelTrace) {
    const [a, bb] = b.channelTrace;
    const bg = document.getElementById('bodygraph');
    const seg1 = bg.querySelector(`[id="gate-${a}-to-${bb}-segment"]`);
    const seg2 = bg.querySelector(`[id="gate-${bb}-to-${a}-segment"]`);
    [seg1, seg2].forEach(s => { if (s) s.classList.add('pulse'); });
    const gl1 = document.getElementById(`gate-${a}`), gl2 = document.getElementById(`gate-${bb}`);
    [gl1, gl2].forEach(s => { if (s) s.classList.add('pulse'); });
    const ch1 = document.getElementById('center-head'), ch2 = document.getElementById('center-ajna');
    [ch1, ch2].forEach(s => { if (s) s.classList.add('pulse'); });
  }
  if (b.connector) {
    // both elements live in the same local (pre-camera-transform) SVG user
    // space, so plain getBBox() gives comparable coordinates without any
    // screen/viewBox conversion.
    const rowEl = document.getElementById(b.connector.from);
    const gateText = document.getElementById(`gate-${b.connector.toGate}`);
    const bodygraphSvg = document.getElementById('bodygraph');
    if (rowEl && gateText && bodygraphSvg) {
      const rBox = rowEl.getBBox();
      const gBoxLocal = gateText.getBBox(); // in #bodygraph's own viewBox (0 0 966 1536)
      const bgX = Number(bodygraphSvg.getAttribute('x')), bgY = Number(bodygraphSvg.getAttribute('y'));
      const bgW = Number(bodygraphSvg.getAttribute('width')), bgH = Number(bodygraphSvg.getAttribute('height'));
      const sx = bgW / 966, sy = bgH / 1536;
      const p1 = { x: rBox.x + (rBox.x < PANEL_W / 2 ? rBox.width : 0), y: rBox.y + rBox.height / 2 };
      const p2 = {
        x: bgX + (gBoxLocal.x + gBoxLocal.width / 2) * sx,
        y: bgY + (gBoxLocal.y + gBoxLocal.height / 2) * sy
      };
      const path = el('path', {
        id: 'dyn-connector',
        d: `M ${p1.x} ${p1.y} C ${(p1.x + p2.x) / 2} ${p1.y}, ${(p1.x + p2.x) / 2} ${p2.y}, ${p2.x} ${p2.y}`,
        fill: 'none', stroke: 'url(#grad-defined)', 'stroke-width': 2.5, 'stroke-dasharray': '2 7',
        opacity: 0.9, class: 'pulse'
      });
      document.getElementById('viewport').appendChild(path);
      gateText.classList.add('pulse');
    }
  }
  if (b.varLabelsOn) {
    document.querySelectorAll('.var-label-text').forEach(n => n.setAttribute('opacity', 1));
  }
  if (b.focusVarKeys) {
    document.querySelectorAll('.var-arrow').forEach(n => {
      const isFocus = b.focusVarKeys.some(k => n.classList.contains(`var-${k}`));
      if (!isFocus) n.classList.add('dim');
    });
    document.querySelectorAll('.var-label-text').forEach(n => {
      const isFocus = b.focusVarKeys.some(k => n.closest(`.var-arrow`).classList.contains(`var-${k}`));
      n.setAttribute('opacity', isFocus ? 1 : 0);
    });
  }
  if (b.softMode) {
    document.querySelectorAll('#bodygraph .gate-label, #bodygraph .channel-track, #bodygraph .gate-segment').forEach(n => n.style.opacity = 0.45);
  } else {
    document.querySelectorAll('#bodygraph .gate-label, #bodygraph .channel-track, #bodygraph .gate-segment').forEach(n => n.style.opacity = '');
  }

  // left panel text
  document.getElementById('step-mini').textContent = b.step;
  document.getElementById('headline').innerHTML = b.headline;
  const bulletsEl = document.getElementById('bullets');
  bulletsEl.innerHTML = (b.bullets || []).map(t => `<li>${t}</li>`).join('');

  document.getElementById('step-n').textContent = String(i + 1);
  history.replaceState(null, '', `#${i + 1}`);
  document.getElementById('prev-btn').disabled = i === 0;
  document.getElementById('next-btn').disabled = i === beats.length - 1;

  buildStepList(i);
}

function buildStepList(current) {
  const grid = document.getElementById('step-grid');
  if (grid.childElementCount === beats.length) {
    grid.querySelectorAll('.step-item').forEach((n, idx) => n.classList.toggle('current', idx === current));
    return;
  }
  grid.innerHTML = '';
  beats.forEach((b, idx) => {
    const item = document.createElement('div');
    item.className = 'step-item' + (idx === current ? ' current' : '');
    const plain = b.headline.replace(/<[^>]+>/g, '');
    item.innerHTML = `<span class="idx">${idx + 1}</span><span>${plain}</span>`;
    item.addEventListener('click', () => { goTo(idx); closeStepModal(); });
    grid.appendChild(item);
  });
}

function goTo(i) {
  i = Math.max(0, Math.min(beats.length - 1, i));
  if (i === cur) return;
  cur = i;
  applyBeat(cur);
}
function next() { goTo(cur + 1); }
function prev() { goTo(cur - 1); }

function openStepModal() { buildStepList(cur); document.getElementById('step-modal').classList.add('open'); }
function closeStepModal() { document.getElementById('step-modal').classList.remove('open'); }

let idleTimer = null;
function resetIdle() {
  document.body.classList.remove('idle');
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => document.body.classList.add('idle'), 2000);
}

function wireUI() {
  document.getElementById('next-btn').addEventListener('click', next);
  document.getElementById('prev-btn').addEventListener('click', prev);
  document.addEventListener('keydown', (e) => {
    if (document.getElementById('step-modal').classList.contains('open')) {
      if (e.key === 'Escape' || e.key.toLowerCase() === 's') closeStepModal();
      return;
    }
    switch (e.key) {
      case 'ArrowRight': case ' ': case 'PageDown': e.preventDefault(); next(); break;
      case 'ArrowLeft': case 'PageUp': prev(); break;
      case 'h': case 'H': document.body.classList.toggle('ui-hidden'); break;
      case 'c': case 'C': document.body.classList.toggle('captions-off'); break;
      case 's': case 'S': openStepModal(); break;
      case 'f': case 'F':
        if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
        else document.exitFullscreen().catch(() => {});
        break;
    }
  });
  document.getElementById('step-modal').addEventListener('click', (e) => {
    if (e.target.id === 'step-modal') closeStepModal();
  });
  ['mousemove', 'mousedown', 'touchstart'].forEach(evt => document.addEventListener(evt, resetIdle));
  resetIdle();
}

document.addEventListener('DOMContentLoaded', () => {
  built = init();
  beats = buildBeats(built);
  document.getElementById('step-total').textContent = String(beats.length);
  wireUI();
  const hashN = parseInt((location.hash || '').replace('#', ''), 10);
  cur = (hashN >= 1 && hashN <= beats.length) ? hashN - 1 : 0;
  applyBeat(cur); // first paint: no transition yet
  requestAnimationFrame(() => requestAnimationFrame(() => {
    document.querySelector('.stage-wrap').classList.add('cam-anim');
  }));
});

</script>
</body>
